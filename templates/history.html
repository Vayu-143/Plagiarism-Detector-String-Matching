<!DOCTYPE html>
<html>

<head>

<title>

Scan History

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container mt-5">

<h1>

Previous Scans

</h1>

<table
class="table
table-dark
table-striped">

<tr>

<th>ID</th>

<th>Date</th>

<th>File</th>

<th>Best Match</th>

<th>Score</th>

</tr>

{% for row in scans %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}%</td>

</tr>

{% endfor %}

</table>

<a
href="/"
class="btn btn-primary">

Home

</a>

</div>

</body>

</html>
